[project]
name = "yo-harness-evals"
version = "0.1.0"
description = "Local Frontier Harness evaluations with Factory Droid and Amp Code"
requires-python = ">=3.12,<3.14"
dependencies = [
    "arize-phoenix-client[harbor]>=3.7.0",
    "harbor==0.26.0",
]

[project.scripts]
harbor-overlay = "viewer_overlay.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnesses", "viewer_overlay"]
